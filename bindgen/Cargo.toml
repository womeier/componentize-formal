[package]
name = "componentize-formal"
version = "0.1.0"
edition = "2021"
description = "Turn a WIT world into a Wasm component backed by CertiRocq's verified Wasm backend"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
wit-parser = "0.254"

[dev-dependencies]
wit-parser = "0.254"
