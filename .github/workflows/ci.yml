# What CI enforces lives in flake.nix, under `checks`. This file only installs
# Nix and runs them, so `nix flake check` in a checkout is the same gate as CI
# and cannot drift from it. To add a check, add it there -- not here.
name: CI

on:
  push:
    branches: ['**']
  # Covers pull requests from forks, whose pushes don't trigger the event above.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Same-repo pull requests are already covered by their push event.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    # `checks.representation` needs CertiRocq, and CertiRocq, MetaRocq and
    # WasmCert-Coq are built from source on purpose (TODO.md#table-export).
    # The cachix step below is what makes that cost once per pin rather than
    # once per push -- but the run that pays it needs room, because MetaRocq
    # alone is hours. Six hours is the cap GitHub enforces regardless; this
    # sits under it so a run that cannot finish is stopped with a number to
    # point at.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          # The substituters and their keys are declared in flake.nix's
          # nixConfig; accepting it keeps them stated once.
          extra_nix_config: accept-flake-config = true

      # Reads and writes womeier.cachix.org, this project's own cache, which
      # is the only one that can hold the three source builds -- see the
      # `nixConfig` comment in flake.nix. Reading is what makes the final step
      # minutes instead of hours; writing is what populates it again after a
      # pin bump or a cache GC. Everything built in the job is pushed,
      # including the generator's own small paths, because a contributor's
      # `nix develop` wants those too.
      #
      # A fork PR has no access to the secret. cachix-action then substitutes
      # from the public cache and skips the push, which is the behaviour we
      # want: making a missing token fatal here would fail every fork PR.
      - uses: cachix/cachix-action@v17
        with:
          name: womeier
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Evaluation only, every system in the flake: catches an eval error on
      # darwin or aarch64 that the build below would never reach.
      - run: nix flake check --all-systems --no-build

      # Builds the checks for this system: the generator and its test suite in
      # the sandbox, clippy, rustfmt, the wit-parser/wasm-tools pin, and
      # repr.rs against a module the real CertiRocq emitted.
      - run: nix flake check --print-build-logs
