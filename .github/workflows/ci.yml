# What CI enforces lives in flake.nix, under `checks`. This file only installs
# Nix and runs them, so `nix flake check` in a checkout is the same gate as CI
# and cannot drift from it. To add a check, add it there -- not here.
name: CI

on:
  push:
    branches: ['**']
  # Covers pull requests from forks, whose pushes don't trigger the event above.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Same-repo pull requests are already covered by their push event.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          # The substituters and their keys are declared in flake.nix's
          # nixConfig; accepting it keeps them stated once.
          extra_nix_config: accept-flake-config = true

      # Evaluation only, every system in the flake: catches an eval error on
      # darwin or aarch64 that the build below would never reach.
      - run: nix flake check --all-systems --no-build

      # `checks.representation` needs CertiRocq, which must always be a
      # substitution from the coq-community caches. Asserting that up front
      # with --max-jobs 0 turns a garbage-collected cache into a failure in
      # seconds, rather than an hours-long MetaRocq build inside the step
      # below. The weekly `pin` workflow catches the same rot when nobody is
      # pushing.
      - run: nix build --max-jobs 0 .#certirocq

      # Builds the checks for this system: the generator and its test suite in
      # the sandbox, clippy, rustfmt, the wit-parser/wasm-tools pin, and
      # repr.rs against a module the real CertiRocq emitted.
      - run: nix flake check --print-build-logs
